# Jekyll configuration for GitHub Pages.
#
# Unified format shared by the DevelApp-ai ecosystem Pages sites:
# Minotaur, CognitiveGraph, ENFAStepLexer-StepParser and Minotaur-Grammars
# all use this same layout — only title/description and the repo-specific
# `exclude` list differ. Keep them in sync when changing this file.

theme: jekyll-theme-leap-day
title: CognitiveGraph
description: High-Performance Zero-Copy Cognitive Graph for Advanced Code Analysis
show_downloads: true

# Repository information
repository: DevelApp-ai/CognitiveGraph
github:
  repository_name: "CognitiveGraph"
  repository_nwo: "DevelApp-ai/CognitiveGraph"
  owner_name: "DevelApp-ai"

# Site URL for sitemap generation
url: https://develapp-ai.github.io
baseurl: /CognitiveGraph

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# Plugins (GitHub Pages supported plugins only)
plugins:
  - jekyll-sitemap

# Render every Markdown file with the theme layout: the root README and
# everything under docs/ becomes a themed page, so the full documentation
# set is browsable on the site, not just the files a theme links by default.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Site navigation (used by the theme where supported; also serves as the
# canonical link list kept identical across the ecosystem sites)
navigation:
  - title: Home
    url: /
  - title: GitHub
    url: https://github.com/DevelApp-ai/CognitiveGraph

# Exclude files from processing
exclude:
  - .git
  - .github
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
@@EXCLUDES@@
  - bin/
  - obj/
  - packages/
  - CognitiveGraph/
  - CognitiveGraph.Tests/
  - GitVersion.yml
  - VERSION_UPDATE_NOTES.md
  - "*.csproj"
  - "*.sln"
